run:
  num_pages: 3
  sleep_s: 1.0

runs:
  enabled: true
  base_dir: "runs"
  run_id_format: "%Y-%m-%d_%H%M"

sources:
  google_jobs:
    enabled: true
    location_mode: "matrix"   # matrix = queries x locations
    locations:
      - "Canada"
      - "United States"
      - "Mexico"

  discovery:
    linkedin_serpapi:
      enabled: false
      num_pages: 5
      sleep_s: 1.0
      gl: "us"
      hl: "en"
    indeed_serpapi:
      enabled: false
      num_pages: 5
      sleep_s: 1.0

    career_pages_serpapi: { enabled: false }

  ats:
    greenhouse: { enabled: false }
    lever: { enabled: false }
    smartrecruiters: { enabled: false }
    workable: { enabled: false }
    ashby: { enabled: false }
    teamtailor: { enabled: false }
    recruitee: { enabled: false }

  enterprise_ats:
    workday: { enabled: false }
    icims: { enabled: false }
    taleo: { enabled: false }
    successfactors: { enabled: false }
    brassring: { enabled: false }
    oracle: { enabled: false }
    jobvite: { enabled: false }
    phenom: { enabled: false }
    eightfold: { enabled: false }
    ukg: { enabled: false }
    adp: { enabled: false }
    cornerstone: { enabled: false }


llm:
  enabled: true
  provider: "openai"          # openai | gemini
  model: "gpt-4.1-mini"
  temperature: 0.2
  top_n: 20
  cache_path: "data/processed/company_ai_cache.json"

queries:
  - name: "SE"
    q: "software engineer contract remote"

domain_resolution:
  enabled: true
  top_n: 50

sales_intel:
  enabled: true

  sales:
    high_min_score: 14
    medium_min_score: 11
    vendor_prob_min: 70
    exclude_company_types: []
    require_not_us_only: true
    max_medium: 25

  competitive:
    enabled: true
    include_company_types:
      - "staffing_agency"
    min_openings: 2

  segmentation:
    mode: "split"   # split | exclude | include_all
    partner_types: [ "consulting", "staffing_agency" ]
    competitive_types: [ "staffing_agency" ]

    allow_unknown_end_clients: true
    unknown_min_score: 16
    unknown_min_vendor_prob: 70

  outputs:
    sales_opportunities_csv: "data/processed/sales_opportunities.csv"
    partner_opportunities_csv: "data/processed/partner_opportunities.csv"
    competitive_watchlist_csv: "data/processed/competitive_watchlist.csv"

enrichment:
  enabled: true
  providers:
    hunter:
      enabled: true
      api_key_env: "HUNTER_API_KEY"
      rate_limit_sleep_s: 1.0
    apollo:
      enabled: false
      api_key_env: "APOLLO_API_KEY"
      rate_limit_sleep_s: 1.0

  # Solo enriquecer empresas que pasen este filtro
  filters:
    min_score: 8
    vendor_prob_min: 70
    require_not_us_only: true

  # Cuántas empresas máximo enriquecer por corrida
  limits:
    max_companies: 25



outputs:
  jobs_csv: "data/processed/jobs_enriched.csv"
  companies_csv: "data/processed/companies_scored.csv"
  enrichment_input_csv: "data/processed/enrichment_input.csv"
  leads_csv: "data/processed/leads.csv"