run:
  num_pages: 1
  sleep_s: 1.0

runs:
  enabled: true
  base_dir: "runs"
  run_id_format: "%Y-%m-%d_%H%M"

database:
  path: "data/oie.db"

cache:
  base_dir: "data/http_cache"

sources:
  google_jobs:
    enabled: true
    location_mode: "matrix"
    locations:
      - "Mexico"
    num_pages: 2
    sleep_s: 1.0

  discovery:
    linkedin_serpapi:
      enabled: true
      num_pages: 2
      sleep_s: 1.0
      gl: "us"
      hl: "en"

    indeed_serpapi:
      enabled: false
      num_pages: 1
      sleep_s: 1.0

    career_pages_serpapi:
      enabled: false
      num_pages: 1
      sleep_s: 1.0

  ats:
    greenhouse: { enabled: false }
    lever: { enabled: false }
    smartrecruiters: { enabled: false }
    workable: { enabled: false }
    ashby: { enabled: false }
    teamtailor: { enabled: false }
    recruitee: { enabled: false }
    breezy: { enabled: false }

  enterprise_ats:
    workday: { enabled: false }
    icims: { enabled: false }
    taleo: { enabled: false }
    successfactors: { enabled: false }
    brassring: { enabled: false }
    oracle: { enabled: false }
    jobvite: { enabled: false }
    phenom: { enabled: false }
    eightfold: { enabled: false }
    ukg: { enabled: false }
    adp: { enabled: false }
    cornerstone: { enabled: false }

llm:
  enabled: true
  provider: "openai"
  model: "gpt-4.1-mini"
  temperature: 0.2
  top_n: 40
  cache_path: "data/processed/company_ai_cache.json"

job_intelligence:
  enabled: true
  max_jobs_to_analyze: 30

queries:
  - name: "Focused Fullstack ES"
    q: "desarrollador full stack remoto"

  - name: "Focused Backend ES"
    q: "desarrollador backend remoto"

  - name: "Focused Python ES"
    q: "desarrollador python remoto"

  - name: "Focused QA ES"
    q: "qa automation remoto"

  - name: "Focused Software Engineer EN"
    q: "software engineer remote latam"

  - name: "Focused Backend Engineer EN"
    q: "backend engineer remote latam"

domain_resolution:
  enabled: true
  mode: "serpapi"
  top_n: 25

sales_intel:
  enabled: true

  sales:
    high_min_score: 12
    medium_min_score: 9
    vendor_prob_min: 55
    exclude_company_types: []
    require_not_us_only: true
    max_medium: 25

  competitive:
    enabled: true
    include_company_types:
      - "staffing_agency"
    min_openings: 2

  segmentation:
    mode: "split"
    partner_types: ["consulting", "staffing_agency"]
    competitive_types: ["staffing_agency"]
    allow_unknown_end_clients: true
    unknown_min_score: 14
    unknown_min_vendor_prob: 60

  outputs:
    sales_opportunities_csv: "data/processed/sales_opportunities.csv"
    partner_opportunities_csv: "data/processed/partner_opportunities.csv"
    competitive_watchlist_csv: "data/processed/competitive_watchlist.csv"

providers:
  clients:
    serpapi:
      api_key_env: "SERPAPI_KEY"
    apollo:
      api_key_env: "APOLLO_API_KEY"
    hunter:
      api_key_env: "HUNTER_API_KEY"
    openai:
      api_key_env: "OPENAI_API_KEY"
    hubspot:
      api_key_env: "HUBSPOT_BEARER_TOKEN"
      base_url: "https://api.hubapi.com"

  limits:
    serpapi: 60
    apollo: 40
    hunter: 20
    openai: 120
    hubspot: 120

  operation_limits:
    openai:
      analyze_job_intelligence: 30
      resolve_company_identity: 20
      validate_company_enrichment: 10
      generate_buyer_personas: 10
      classify_company: 20
      domain_ai_validation: 30
      score_company: 20
      score_company_opportunity: 20
      score_opportunity: 20
      score_lead: 10
    serpapi:
      search_google: 60
    apollo:
      enrich_company_by_domain: 40
      search_people_by_domain_and_titles: 40
    hunter:
      search_domain_contacts: 20
    hubspot:
      create_company: 40
      create_contact: 80
      create_task: 80
      create_note: 80

enrichment:
  apollo_company_ttl_days: 30
  max_companies_per_run: 50
  min_opportunity_score: 10
  require_accepted_domain: true
  allowed_company_types: ["end_client", "unknown", ""]

lead_generation:
  max_companies_per_run: 50
  min_opportunity_score: 10
  require_accepted_domain: true
  enable_stub_leads: false
  max_hunter_results_per_company: 2
  max_apollo_results_per_company: 5
  max_leads_per_company: 5
  hunter_min_email_quality: 40

hubspot:
  enabled: true
  push_enabled: true
  pause_before_push: false
  owner_id: "${HUBSPOT_USER_ID}"
  target_account: "${HUBSPOT_COMPANY_ID}"
  source_tag: "OIE"
  max_contacts_per_company: 3

outputs:
  path: "data/outputs"
  jobs_csv: "data/processed/jobs_enriched.csv"
  companies_csv: "data/processed/companies_scored.csv"
  enrichment_input_csv: "data/processed/enrichment_input.csv"
  leads_csv: "data/processed/leads.csv"
  spreadsheets_dir: "spreadsheets"
